<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The Northstar star mark, borrowed from Northstar v2 (docs/BORROW.md-style port). -->
    <link rel="icon" href="/favicon.png" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Northstar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Northstar Forecast</title>
    <!-- V5-REVIEW-1 F20: stamp the chosen theme before first paint, so an
         OS/app mismatch never flashes the wrong theme while the bundle loads.
         Same key and values as ThemeToggle.tsx; an un-chosen theme stamps
         nothing and the media query follows the OS. -->
    <script>
      try {
        var t = localStorage.getItem('northstar:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
